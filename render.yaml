services:
  - type: web
    name: shophoa-python
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AI_MODE
        value: gemini
