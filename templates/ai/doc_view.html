{% extends 'base.html' %}
{% load static core_tags %}

{% block title %}{{ filename }} - Tài Liệu Chính Sách Flora Flower{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 p-md-5 border-0 shadow-sm rounded-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <span class="badge bg-success-subtle text-success mb-2">Tài Liệu Đã Xác Nhận</span>
                        <h3 class="font-serif fw-bold mb-0">{{ filename }}</h3>
                    </div>
                    <a href="{% url 'ai.assistant' %}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại Trợ lý AI
                    </a>
                </div>
                <div class="markdown-body text-secondary lh-lg" style="white-space: pre-wrap; font-size: 15px;">
{{ content }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
